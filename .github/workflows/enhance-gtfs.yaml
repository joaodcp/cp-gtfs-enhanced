name: Download and Enhance CP GTFS

on:
    schedule:
        - cron: "*/6 1 * * *"
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    enhance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: check if gtfs was updated today (cron only)
              if: github.event_name == 'schedule'
              run: |
                  today=$(date -u '+%d %b %Y')
                  # fetch remote last-modified header
                  lm=$(curl -sI https://publico.cp.pt/gtfs/gtfs.zip | grep -i Last-Modified | cut -d' ' -f2-)
                  if [[ "$lm" == *"$today"* ]]; then
                      echo "gtfs updated today, continuing"
                  else
                      echo "no update today, exiting"
                      exit 0
                  fi

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: install deps
              run: pip install -r requirements.txt

            - name: run pipeline
              run: python enhance.py

            - name: upload gtfs
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: cp-gtfs-enhanced
                  path: enhanced/*.zip

            - name: set date tag
              id: date
              run: echo "today=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

            - name: release gtfs
              if: success()
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.date.outputs.today }}
                  name: Enhanced GTFS (${{ steps.date.outputs.today }})
                  files: enhanced/*.zip
                  draft: false
