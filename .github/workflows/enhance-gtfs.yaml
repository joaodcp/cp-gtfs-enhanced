name: Download and Enhance CP GTFS

on:
    schedule:
        - cron: "*/6 1 * * *"
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    enhance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: check if gtfs was updated today (cron only)
              if: github.event_name == 'schedule'
              run: |
                  today=$(date -u '+%d %b %Y')
                  # fetch remote last-modified header
                  lm=$(curl -sI https://publico.cp.pt/gtfs/gtfs.zip | grep -i Last-Modified | cut -d' ' -f2-)
                  if [[ "$lm" == *"$today"* ]]; then
                      echo "gtfs updated today, continuing"
                  else
                      echo "no update today, exiting"
                      exit 0
                  fi

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: install deps
              run: pip install -r requirements.txt

            - name: download original GTFS
              run: |
                  mkdir -p original
                  wget -q https://publico.cp.pt/gtfs/gtfs.zip -O original/cp_gtfs_original.zip

            - name: run pipeline
              env:
                  GTFS_ZIP_PATH: original/cp_gtfs_original.zip

                  # travel api
                  CP_TRAVEL_API_KEY: ${{ secrets.CP_TRAVEL_API_KEY }}
                  CP_TRAVEL_CONNECT_ID: ${{ secrets.CP_TRAVEL_CONNECT_ID }}
                  CP_TRAVEL_CONNECT_SECRET: ${{ secrets.CP_TRAVEL_CONNECT_SECRET }}

                  # realtime api
                  CP_REALTIME_API_KEY: ${{ secrets.CP_REALTIME_API_KEY }}
                  CP_REALTIME_CONNECT_ID: ${{ secrets.CP_REALTIME_CONNECT_ID }}
                  CP_REALTIME_CONNECT_SECRET: ${{ secrets.CP_REALTIME_CONNECT_SECRET }}

                  # gis api
                  CP_GIS_API_KEY: ${{ secrets.CP_GIS_API_KEY }}
                  CP_GIS_CONNECT_ID: ${{ secrets.CP_GIS_CONNECT_ID }}
                  CP_GIS_CONNECT_SECRET: ${{ secrets.CP_GIS_CONNECT_SECRET }}
              run: python enhance.py

            - name: download OSM data for Portugal
              run: wget -q https://download.geofabrik.de/europe/portugal-latest.osm.pbf -O portugal.osm.pbf

            - name: run pfaedle on enhanced and original GTFS
              run: |
                  mkdir -p gtfs-out-enhanced gtfs-out-original

                  docker run -i --rm \
                    --volume ${{ github.workspace }}:/osm \
                    --volume ${{ github.workspace }}/enhanced:/gtfs \
                    --volume ${{ github.workspace }}/gtfs-out-enhanced:/gtfs-out \
                    ghcr.io/ad-freiburg/pfaedle:latest \
                    -D -x /osm/portugal.osm.pbf -i /gtfs/cp_gtfs_enhanced.zip

                  cd gtfs-out-enhanced && zip -r ../enhanced/cp_gtfs_enhanced.zip *.txt
                  cd ..

                  docker run -i --rm \
                    --volume ${{ github.workspace }}:/osm \
                    --volume ${{ github.workspace }}/original:/gtfs \
                    --volume ${{ github.workspace }}/gtfs-out-original:/gtfs-out \
                    ghcr.io/ad-freiburg/pfaedle:latest \
                    -D -x /osm/portugal.osm.pbf -i /gtfs/cp_gtfs_original.zip

                  cd gtfs-out-original && zip -r ../enhanced/cp_gtfs_pfaedled.zip *.txt

            - name: upload gtfs
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: cp-gtfs-enhanced
                  path: enhanced/*.zip

            - name: set date tag
              id: date
              run: echo "today=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

            - name: release gtfs
              if: success()
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.date.outputs.today }}
                  name: Enhanced GTFS (${{ steps.date.outputs.today }})
                  files: enhanced/*.zip
                  draft: false
