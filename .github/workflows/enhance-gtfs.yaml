name: Download and Enhance CP GTFS

on:
    # schedule:
    #     - cron: "*/5 1 * * *"
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    enhance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: install deps
              run: pip install -r requirements.txt

            - name: run pipeline
              run: python enhance.py

            - name: upload gtfs
              if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: cp-gtfs-enhanced
                  path: enhanced/*.zip

            - name: set date tag
              id: date
              run: echo "today=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

            - name: release gtfs
              if: success()
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.date.outputs.today }}
                  name: cp-gtfs-enhanced
                  files: enhanced/*.zip
                  draft: false
